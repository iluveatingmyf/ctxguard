# Typical automations (patterns common in HA blueprints / IFTTT studies).
# One action per rule; multi-action rules are split into one rule per action.
- id: L3_r01
  alias: Ventilate master bedroom when CO2 is high
  trigger: [{platform: numeric_state, entity_id: sensor.master_co2, above: 1000}]
  action: [{service: cover.open_cover, target: {entity_id: cover.master_window}}]
- id: L3_r02
  alias: Ventilate kids room when CO2 is high
  trigger: [{platform: numeric_state, entity_id: sensor.kids_co2, above: 1000}]
  action: [{service: cover.open_cover, target: {entity_id: cover.kids_window}}]
- id: L3_r03
  alias: Unlock front door for escape when smoke is detected
  trigger: [{platform: state, entity_id: binary_sensor.kitchen_smoke, to: "on"}]
  action: [{service: lock.unlock, target: {entity_id: lock.front_door}}]
- id: L3_r04
  alias: Open living window when CO rises
  trigger: [{platform: numeric_state, entity_id: sensor.living_co, above: 30}]
  action: [{service: cover.open_cover, target: {entity_id: cover.living_window}}]
- id: L3_r05
  alias: Shut water main on leak
  trigger: [{platform: state, entity_id: binary_sensor.bathroom_leak, to: "on"}]
  action: [{service: valve.close_valve, target: {entity_id: valve.water_main}}]
- id: L3_r06
  alias: Shut gas main on gas detection
  trigger: [{platform: state, entity_id: binary_sensor.kitchen_gas, to: "on"}]
  action: [{service: valve.close_valve, target: {entity_id: valve.gas_main}}]
- id: L3_r07
  alias: Arm alarm when Alex leaves
  trigger: [{platform: state, entity_id: person.alex, to: not_home}]
  action: [{service: alarm_control_panel.alarm_arm_away, target: {entity_id: alarm_control_panel.home}}]
- id: L3_r08
  alias: Cool the living room through the window when it is hot inside
  trigger: [{platform: numeric_state, entity_id: sensor.living_temperature, above: 28}]
  action: [{service: cover.open_cover, target: {entity_id: cover.living_window}}]
- id: L3_r09
  alias: Bathroom exhaust on high humidity
  trigger: [{platform: numeric_state, entity_id: sensor.bathroom_humidity, above: 75}]
  action: [{service: fan.turn_on, target: {entity_id: fan.bathroom_exhaust}}]
- id: L3_r10
  alias: Open master blind at 7:00
  trigger: [{platform: time, at: "07:00:00"}]
  action: [{service: cover.open_cover, target: {entity_id: cover.master_blind}}]
- id: L3_r11
  alias: Hallway light on motion
  trigger: [{platform: state, entity_id: binary_sensor.hallway_motion, to: "on"}]
  action: [{service: light.turn_on, target: {entity_id: light.hallway}}]
- id: L3_r12
  alias: Cut grandma room outlet when Alex leaves (energy saving)
  trigger: [{platform: state, entity_id: person.alex, to: not_home}]
  action: [{service: switch.turn_off, target: {entity_id: switch.grandma_heater_outlet}}]
- id: L3_r13
  alias: Start robot vacuum when Sam leaves
  trigger: [{platform: state, entity_id: person.sam, to: not_home}]
  action: [{service: vacuum.start, target: {entity_id: vacuum.robot}}]
- id: L3_r14
  alias: Turn on indoor camera when doorbell rings
  trigger: [{platform: state, entity_id: binary_sensor.doorbell, to: "on"}]
  action: [{service: switch.turn_on, target: {entity_id: switch.indoor_camera}}]
- id: L3_r15
  alias: Announce washer finished in master bedroom
  trigger: [{platform: state, entity_id: sensor.washer_status, to: finished}]
  action: [{service: tts.speak, target: {entity_id: tts.google}, data: {media_player_entity_id: media_player.master_speaker, message: "Laundry is done"}}]
- id: L3_r16
  alias: Unlock front door when Alex arrives
  trigger: [{platform: state, entity_id: person.alex, to: home}]
  action: [{service: lock.unlock, target: {entity_id: lock.front_door}}]
- id: L3_r17
  alias: Turn stove off when nobody is in the kitchen for 30 minutes
  trigger: [{platform: state, entity_id: binary_sensor.kitchen_motion, to: "off", for: {minutes: 30}}]
  action: [{service: switch.turn_off, target: {entity_id: switch.stove}}]
- id: L3_r18
  alias: Heat living room when it is cold outside
  trigger: [{platform: numeric_state, entity_id: sensor.outdoor_temperature, below: 5}]
  action: [{service: climate.set_hvac_mode, target: {entity_id: climate.living}, data: {hvac_mode: heat}}]
