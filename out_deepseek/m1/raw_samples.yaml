fan_on:
- effects:
  - channel: air_exchange
    direction: increase
    requires_extra_device: false
    precondition: always
    why: A fan circulates air, which can increase air movement and exchange with surroundings, especially if windows or vents
      are open.
  - channel: indoor_temperature
    direction: decrease
    requires_extra_device: false
    precondition: 'if the indoor air is warmer than the occupant''s skin (typically above about 25°C), the fan''s airflow
      increases convective heat loss from occupants, making them feel cooler, but it does not lower the actual air temperature.
      However, the fan motor adds a small amount of heat, so the net effect on air temperature is a slight increase. For the
      purpose of perceived cooling, we consider a decrease in effective temperature, but for the physical channel indoor_temperature,
      the direction is increase due to motor heat. We must be precise: the physical air temperature increases slightly because
      of the motor''s waste heat. So direction should be increase.'
    why: The fan motor generates heat, which slightly raises indoor air temperature, though the airflow can increase evaporative
      and convective cooling on skin, making occupants feel cooler.
  - channel: sound
    direction: increase
    requires_extra_device: false
    precondition: always
    why: The fan motor and blades produce noise.
  - channel: power_supply
    direction: increase
    requires_extra_device: false
    precondition: if the fan is plugged into a smart outlet that measures power, turning on the fan increases the power drawn
      from that outlet. However, the action itself does not directly change the power supply channel unless the fan is connected
      to a controlled outlet. Typically, the fan is directly powered and the action turns it on, so the power supply to the
      fan is increased. So direction increase.
    why: The fan consumes electrical power when turned on.
  - channel: mechanical_motion
    direction: increase
    requires_extra_device: false
    precondition: always
    why: Fan blades rotate, creating moving parts that could potentially cause injury if contacted.
- effects:
  - channel: air_exchange
    direction: increase
    requires_extra_device: false
    precondition: always
    why: A fan moves air, increasing air circulation and exchange within the room.
  - channel: indoor_temperature
    direction: either
    requires_extra_device: false
    precondition: If the fan is used with an open window or in a room where outdoor temperature is lower than indoor, it can
      decrease indoor temperature by bringing in cooler air; if the fan motor generates heat or if the fan is used in a closed
      room with no temperature difference, it can increase indoor temperature slightly due to motor heat.
    why: Fan operation can influence temperature through air movement and motor heat.
  - channel: indoor_humidity
    direction: either
    requires_extra_device: false
    precondition: If the fan increases air exchange with drier outdoor air, indoor humidity decreases; if the fan is in a
      closed room and causes evaporation of moisture (e.g., from occupants or wet surfaces), it can increase humidity.
    why: Fan affects humidity via air exchange and evaporation.
  - channel: sound
    direction: increase
    requires_extra_device: false
    precondition: always
    why: Fan operation produces noise from motor and blades.
  - channel: mechanical_motion
    direction: increase
    requires_extra_device: false
    precondition: always
    why: Fan blades rotate, creating mechanical motion that could potentially contact objects or people.
- effects:
  - channel: air_exchange
    direction: increase
    requires_extra_device: false
    precondition: always
    why: A fan circulates air and can increase air exchange, especially if near an open window or door, but even without,
      it moves air within the space.
  - channel: sound
    direction: increase
    requires_extra_device: false
    precondition: always
    why: Fan motor and blades produce noise when operating.
  - channel: indoor_temperature
    direction: either
    requires_extra_device: false
    precondition: Falls if the fan draws in cooler outside air or increases evaporation from skin (perceived cooling), rises
      if the motor heat adds warmth or if it mixes warmer stratified air down.
    why: Fan does not change total heat but can affect temperature distribution and perceived temperature; actual air temperature
      may slightly rise due to motor heat, but if the fan brings in cooler outside air, temperature may drop.
  - channel: indoor_humidity
    direction: either
    requires_extra_device: false
    precondition: Rises if fan draws in humid outside air or if it evaporates moisture from wet surfaces; falls if it increases
      evaporation from skin/plants and exhausts humid air.
    why: Fan affects moisture distribution and evaporation rates; net effect depends on source of air and moisture content.
  - channel: mechanical_motion
    direction: increase
    requires_extra_device: false
    precondition: always
    why: Fan blades rotate and can cause injury if touched.
exhaust_fan_on:
- effects:
  - channel: air_exchange
    direction: increase
    requires_extra_device: false
    precondition: always
    why: The exhaust fan actively moves air from indoors to outdoors, increasing the rate of air exchange.
  - channel: indoor_humidity
