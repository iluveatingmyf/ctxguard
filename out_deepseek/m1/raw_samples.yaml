open_window:
- effects:
  - channel: passage_opening
    direction: increase
    requires_extra_device: false
    precondition: always
    why: Opening a window increases the physical openness of the passage between inside and outside.
  - channel: air_exchange
    direction: increase
    requires_extra_device: false
    precondition: always
    why: An open window allows more air to flow between indoors and outdoors, increasing ventilation.
  - channel: indoor_temperature
    direction: either
    requires_extra_device: false
    precondition: If outdoor temperature is higher than indoor, indoor temperature rises; if outdoor temperature is lower,
      indoor temperature falls.
    why: Heat exchange through the open window depends on the temperature difference between inside and outside.
  - channel: indoor_humidity
    direction: either
    requires_extra_device: false
    precondition: If outdoor humidity is higher than indoor, indoor humidity rises; if outdoor humidity is lower, indoor humidity
      falls.
    why: Moisture exchange through the open window depends on the humidity difference between inside and outside.
  - channel: sound
    direction: increase
    requires_extra_device: false
    precondition: always
    why: An open window allows more outdoor sounds to enter the indoor space.
  - channel: visibility
    direction: increase
    requires_extra_device: false
    precondition: always
    why: An open window increases how much of the indoor space can be seen from outside.
- effects:
  - channel: passage_opening
    direction: increase
    requires_extra_device: false
    precondition: always
    why: Opening a window increases the physical openness of the passage between inside and outside.
  - channel: air_exchange
    direction: increase
    requires_extra_device: false
    precondition: always
    why: An open window allows more air to exchange between indoor and outdoor.
  - channel: indoor_temperature
    direction: either
    requires_extra_device: false
    precondition: rises if outdoor temperature is higher than indoor; falls if outdoor temperature is lower than indoor
    why: Heat transfer through the open window depends on the temperature difference.
  - channel: indoor_humidity
    direction: either
    requires_extra_device: false
    precondition: rises if outdoor humidity is higher than indoor; falls if outdoor humidity is lower than indoor
    why: Moisture transfer through the open window depends on the humidity difference.
  - channel: sound
    direction: increase
    requires_extra_device: false
    precondition: always
    why: An open window allows more outdoor sound to enter the indoor space.
  - channel: illumination
    direction: either
    requires_extra_device: false
    precondition: rises if outdoor light level is higher than indoor; falls if outdoor light level is lower than indoor
    why: Light transfer through the open window depends on the light level difference.
  - channel: visibility
    direction: increase
    requires_extra_device: false
    precondition: always
    why: An open window increases how much of the indoor space can be seen from outside.
- effects:
  - channel: passage_opening
    direction: increase
    requires_extra_device: false
    precondition: always
    why: The window opens, increasing the physical openness of the passage.
  - channel: air_exchange
    direction: increase
    requires_extra_device: false
    precondition: always
    why: An open window allows air to flow between inside and outside, increasing air exchange.
  - channel: indoor_temperature
    direction: either
    requires_extra_device: false
    precondition: If outdoor temperature is higher than indoor, indoor temperature increases; if outdoor temperature is lower,
      indoor temperature decreases.
    why: Heat transfer through the open window depends on the temperature difference between inside and outside.
  - channel: indoor_humidity
    direction: either
    requires_extra_device: false
    precondition: If outdoor humidity is higher than indoor, indoor humidity increases; if outdoor humidity is lower, indoor
      humidity decreases.
    why: Moisture transfer through the open window depends on the humidity difference between inside and outside.
  - channel: sound
    direction: increase
    requires_extra_device: false
    precondition: always
    why: An open window allows outdoor sounds to enter the indoor space, increasing sound level.
  - channel: visibility
