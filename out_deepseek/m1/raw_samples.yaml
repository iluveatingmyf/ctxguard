    requires_extra_device: false
    precondition: if heating was on, indoor temperature decreases; if cooling was on, indoor temperature increases
    why: 'Without HVAC conditioning, indoor temperature drifts toward outdoor temperature: decreases if previously heated,
      increases if previously cooled.'
  - channel: indoor_humidity
    direction: either
    requires_extra_device: false
    precondition: if HVAC was dehumidifying, humidity increases; if humidifying, humidity decreases
