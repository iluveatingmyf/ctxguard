version: E-k1
samples: 1
temperature: 0.0
direction_rule: majority
prompt_version: M1-v3 (direction 'either'; channel vote + direction rule)
rejected_out_of_vocab: 0
discarded_extra_device: 15
n_bidirectional: 22
bidirectional:
- close_blind:indoor_temperature
- close_garage:indoor_humidity
- close_garage:indoor_temperature
- close_window:indoor_humidity
- close_window:indoor_temperature
- cool_on:air_exchange
- exhaust_fan_on:indoor_temperature
- fan_on:indoor_humidity
- fan_on:indoor_temperature
- humidifier_on:indoor_temperature
- hvac_off:indoor_humidity
- hvac_off:indoor_temperature
- open_blind:indoor_temperature
- open_garage:indoor_humidity
- open_garage:indoor_temperature
- open_window:indoor_humidity
- open_window:indoor_temperature
- unlock_door:air_exchange
