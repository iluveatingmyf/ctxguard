effects:
- id: air_exchange:decrease
  channel: air_exchange
  direction: decrease
  desc: decrease of air exchange (Rate of air exchange between indoor zone and outdoors (ventilation).)
  preconditions:
    close_window: always
    close_blind: if the blind is closed over an open window or door, it reduces the airflow between indoors and outdoors |
      if the blind covers an open window and reduces airflow | if the window behind the blind is open
    close_garage: always
    unlock_door: increases when the door is opened after unlocking; decreases when the door remains closed | if the door is
      subsequently opened, air exchange increases; if it remains closed, air exchange stays the same
    cool_on: If the cooling system includes a fresh air intake or is a window unit that draws some outside air, air exchange
      increases; otherwise, for a typical split system recirculating indoor air, air exchange remains unchanged. | If the
      HVAC system includes outdoor air intake, air exchange increases; if it recirculates indoor air only, air exchange remains
      unchanged. | increases if the cooling system draws in outdoor air (e.g., through a fresh air intake), decreases if the
      system is recirculating indoor air only
    hvac_off: if HVAC was running a fan or ventilation mode | always, if the HVAC system provides ventilation (fan) that stops
      when turned off.
    vacuum_start: Increases if vacuum exhaust stirs air and enhances mixing; decreases if vacuum is set to recirculate air
      internally without external exchange. | always | If the vacuum has a HEPA filter and creates airflow, it may slightly
      increase air exchange; otherwise no change.
- id: air_exchange:increase
  channel: air_exchange
  direction: increase
  desc: increase of air exchange (Rate of air exchange between indoor zone and outdoors (ventilation).)
  preconditions:
    open_window: always
    open_blind: if the window behind the blind is open
    open_garage: always
    unlock_door: increases when the door is opened after unlocking; decreases when the door remains closed | if the door is
      subsequently opened, air exchange increases; if it remains closed, air exchange stays the same
    cool_on: If the cooling system includes a fresh air intake or is a window unit that draws some outside air, air exchange
      increases; otherwise, for a typical split system recirculating indoor air, air exchange remains unchanged. | If the
      HVAC system includes outdoor air intake, air exchange increases; if it recirculates indoor air only, air exchange remains
      unchanged. | increases if the cooling system draws in outdoor air (e.g., through a fresh air intake), decreases if the
      system is recirculating indoor air only
    fan_on: always
    exhaust_fan_on: always
    vacuum_start: Increases if vacuum exhaust stirs air and enhances mixing; decreases if vacuum is set to recirculate air
      internally without external exchange. | always | If the vacuum has a HEPA filter and creates airflow, it may slightly
      increase air exchange; otherwise no change.
