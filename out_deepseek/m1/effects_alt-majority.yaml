- id: indoor_humidity:decrease
  channel: indoor_humidity
  direction: decrease
  desc: decrease of indoor humidity (Relative humidity of the indoor zone.)
  preconditions:
    open_window: If outdoor humidity is higher than indoor, indoor humidity rises; if outdoor humidity is lower, indoor humidity
      falls. | rises if outdoor humidity is higher than indoor; falls if outdoor humidity is lower than indoor | If outdoor
      humidity is higher than indoor, indoor humidity increases; if outdoor humidity is lower, indoor humidity decreases.
    close_window: If outdoor humidity is higher than indoor, closing the window prevents moisture ingress and indoor humidity
      may fall; if outdoor is lower, closing traps indoor moisture and humidity may rise. | If outdoor humidity is lower than
      indoor, closing may increase indoor humidity by reducing moisture loss; if outdoor humidity is higher, closing may decrease
      indoor humidity by reducing moisture gain. | If outdoor humidity is higher than indoor, closing the window reduces moisture
      ingress and indoor humidity may decrease; if outdoor humidity is lower, closing may increase indoor humidity by trapping
      moisture from occupants and activities.
    open_garage: if outdoor humidity is higher than indoor, indoor humidity increases; if lower, decreases | If the outside
      humidity is higher than the garage, the garage humidity increases; if lower, it decreases. | If the outdoor humidity
      is higher than the indoor humidity, opening the garage door will increase indoor humidity; if the outdoor humidity is
      lower, it will decrease indoor humidity.
    close_garage: If the outside air is more humid than the garage air, closing the door may cause humidity to decrease by
      blocking humid air; if the outside air is less humid, closing the door may cause humidity to increase by trapping moisture
      inside. | if outside is more humid than garage, closing reduces humidity increase; if outside is less humid, closing
      reduces humidity decrease
    unlock_door: changes only if the door is opened; direction depends on humidity difference between inside and outside |
      if the door is opened and outdoor humidity differs from indoor, indoor humidity changes accordingly; if door remains
      closed, no change
    heat_on: if the heating system does not add moisture to the air | If the heating system is a combustion type that releases
      moisture, humidity increases; if it uses dry electric heat or a heat pump, humidity may decrease as warmer air lowers
      relative humidity.
    cool_on: always
    hvac_off: if HVAC was dehumidifying, humidity increases; if humidifying, humidity decreases | If the HVAC was dehumidifying,
      turning it off causes indoor humidity to increase; if it was humidifying, turning it off causes indoor humidity to decrease.
      | If the HVAC was dehumidifying (cooling), turning it off increases humidity; if it was humidifying, turning it off
      decreases humidity; if no humidity control, no change.
    fan_on: If the fan increases air exchange with drier outdoor air, indoor humidity decreases; if the fan is in a closed
      room and causes evaporation of moisture (e.g., from occupants or wet surfaces), it can increase humidity. | Rises if
      fan draws in humid outside air or if it evaporates moisture from wet surfaces; falls if it increases evaporation from
      skin/plants and exhausts humid air.
    exhaust_fan_on: Decreases when indoor humidity is higher than outdoor humidity; increases when outdoor humidity is higher
      than indoor humidity. | indoor humidity is higher than outdoor humidity | outdoor humidity is higher than indoor humidity
      | when indoor humidity is higher than outdoor humidity; otherwise it may increase
    vacuum_start: Increases if vacuum has a wet mopping function that releases water; decreases if it has a dehumidifying
      feature or if dry exhaust reduces moisture locally. | If the vacuum has a wet mopping feature and water is added, humidity
      increases; otherwise no change. | If the vacuum has a wet mopping feature and it is active, humidity increases; otherwise
      no change.
