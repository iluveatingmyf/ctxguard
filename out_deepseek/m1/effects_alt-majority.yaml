- id: indoor_temperature:decrease
  channel: indoor_temperature
  direction: decrease
  desc: decrease of indoor temperature (Air temperature of the indoor zone.)
  preconditions:
    open_window: If outdoor temperature is higher than indoor, indoor temperature rises; if outdoor temperature is lower,
      indoor temperature falls. | rises if outdoor temperature is higher than indoor; falls if outdoor temperature is lower
      than indoor | If outdoor temperature is higher than indoor, indoor temperature increases; if outdoor temperature is
      lower, indoor temperature decreases.
    close_window: If the outdoor temperature is lower than indoor, closing the window reduces heat loss and indoor temperature
      may rise; if outdoor is warmer, closing reduces heat gain and indoor temperature may fall. | If outdoor temperature
      is lower than indoor, closing may increase indoor temperature by reducing cooling; if outdoor temperature is higher,
      closing may decrease indoor temperature by reducing heat gain. | If it is warmer inside than outside, closing the window
      reduces heat loss and indoor temperature may rise; if it is cooler inside than outside, closing reduces heat gain and
      indoor temperature may fall.
    open_blind: increases if sunlight enters and warms the room; decreases if the blind was blocking cold air from entering
      through a window and outside is colder than inside | Rises when sunlight enters and warms the room; falls when the outdoor
      temperature is lower and heat escapes through the window. | if outdoor temperature is higher than indoor, opening blind
      may increase indoor temperature by letting in warm air or sunlight; if outdoor is colder, it may decrease indoor temperature
      by letting in cold air (if window open) or reducing insulation
    close_blind: if it is warmer outside than inside, closing the blind can decrease indoor temperature by blocking solar
      heat gain; if it is colder outside, closing the blind can increase indoor temperature by adding insulation and reducing
      heat loss through the window | if outside is warmer than inside, closing the blind may decrease indoor temperature by
      blocking solar heat; if outside is colder, it may increase indoor temperature by adding insulation | rises if the blind
      blocks cooling breezes or traps heat from sunlight; falls if it blocks solar heat gain
    open_garage: if outdoor temperature is higher than indoor, indoor temperature increases; if lower, decreases | If the
      outside temperature is warmer than the garage, the garage temperature increases; if the outside is cooler, it decreases.
      | If the outdoor temperature is higher than the indoor temperature, opening the garage door will increase indoor temperature;
      if the outdoor temperature is lower, it will decrease indoor temperature.
    close_garage: If the garage is warmer than outside, closing the door reduces heat loss and may cause temperature to rise;
      if the garage is cooler than outside, closing the door reduces heat gain and may cause temperature to fall. | if outside
      is warmer than garage, closing reduces temperature increase; if outside is cooler, closing reduces temperature decrease
    unlock_door: changes only if the door is opened; direction depends on temperature difference between inside and outside
      | if the door is opened and outdoor temperature differs from indoor, indoor temperature changes accordingly; if door
      remains closed, no change
    cool_on: always
    hvac_off: if heating was on, indoor temperature decreases; if cooling was on, indoor temperature increases | If the HVAC
      was heating, turning it off causes indoor temperature to decrease toward outdoor temperature; if it was cooling, turning
      it off causes indoor temperature to increase toward outdoor temperature. | If the indoor temperature is above the outdoor
      temperature, turning off the HVAC causes indoor temperature to decrease (cooling stops). If the indoor temperature is
      below the outdoor temperature, indoor temperature increases (heating stops). If equal, no change.
    fan_on: 'if the indoor air is warmer than the occupant''s skin (typically above about 25°C), the fan''s airflow increases
      convective heat loss from occupants, making them feel cooler, but it does not lower the actual air temperature. However,
      the fan motor adds a small amount of heat, so the net effect on air temperature is a slight increase. For the purpose
      of perceived cooling, we consider a decrease in effective temperature, but for the physical channel indoor_temperature,
      the direction is increase due to motor heat. We must be precise: the physical air temperature increases slightly because
      of the motor''s waste heat. So direction should be increase. | If the fan is used with an open window or in a room where
      outdoor temperature is lower than indoor, it can decrease indoor temperature by bringing in cooler air; if the fan motor
      generates heat or if the fan is used in a closed room with no temperature difference, it can increase indoor temperature
      slightly due to motor heat. | Falls if the fan draws in cooler outside air or increases evaporation from skin (perceived
      cooling), rises if the motor heat adds warmth or if it mixes warmer stratified air down.'
    exhaust_fan_on: Decreases when outdoor temperature is lower than indoor temperature; increases when outdoor temperature
      is higher than indoor temperature. | rises when outdoor temperature is higher than indoor temperature; falls when outdoor
      temperature is lower than indoor temperature | decreases when outdoor air is cooler than indoor air; increases when
      outdoor air is warmer than indoor air
    stove_off: if the stove was heating the room | always | if the stove was heating the room, turning it off will decrease
      indoor temperature; if the stove was cooling the room (e.g., due to ventilation), turning it off may increase indoor
      temperature; otherwise no change
    humidifier_on: if humidifier uses evaporative cooling | if the humidifier uses an evaporative wick and fan (evaporative
      cooling effect) | if the humidifier uses a heating element (warm mist humidifier)
