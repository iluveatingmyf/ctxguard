  channel: visibility
  direction: increase
  desc: increase of visibility (How much of the indoor space can be seen from outside.)
  preconditions:
    open_window: always
    open_blind: always
    open_garage: always
    unlock_door: if the door is opened after unlocking; otherwise no change | if the door is opened, visibility from outside
      into the home increases; if closed, no change
    light_on: if the light is on and there are windows or openings, making the interior more visible from outside | if the
      light makes the interior more visible from outside (e.g., at night with uncovered windows)
- id: water_flow:decrease
  channel: water_flow
  direction: decrease
  desc: decrease of water flow (Water supplied through plumbing.)
  preconditions:
    water_valve_close: always
- id: water_flow:increase
  channel: water_flow
  direction: increase
  desc: increase of water flow (Water supplied through plumbing.)
  preconditions:
    water_valve_open: always
