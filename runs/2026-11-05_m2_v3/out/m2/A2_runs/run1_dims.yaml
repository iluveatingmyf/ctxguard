dims:
- id: air_quality
  desc: What is the indoor air quality like in the home?
  variables: &id002
  - what is the air quality like in the home?
  - what indoor air quality issue is present?
  - what abnormal or dangerous event is happening in the laundry room?
  - what abnormal or dangerous event is happening in the home?
  origin: grouped
  verification:
    single_variable: false
    checked: true
    reason: Member 2 and 3 ask about abnormal or dangerous events, not air quality.
    issues: &id003 []
- id: temperature
  desc: How warm or cold is the room or home?
  variables: &id004
  - how warm or cold is the room?
  - how warm or cold is the home?
  origin: grouped
  verification:
    single_variable: true
    checked: true
    reason: Both questions ask about the temperature of the same entity (room or home) without introducing any additional
      context or device-specific details.
    issues: &id005 []
- id: presence
  desc: Is anyone at home or in the room?
  variables: &id006
  - is anyone intruding?
  - what are the people doing?
  - what are the people in the room doing?
  - is anyone at home?
  origin: grouped
  verification:
    single_variable: false
    checked: true
    reason: Members ask different questions. 'is anyone intruding?' asks about intruders, 'what are the people doing?' and
      'what are the people in the room doing?' ask about actions, and 'is anyone at home?' asks about the presence of people
      at home.
    issues: &id007 []
- id: motion
  desc: Is there motion in the room?
  variables:
  - is there motion in the room?
  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: time_of_day
  desc: What time of day is it?
