  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: illuminance_during_daytime
  desc: 'What is the indoor illuminance level? (split: what is the indoor illuminance level during the daytime?)'
  variables:
  - what is the indoor illuminance level during the daytime?
  origin: split of illuminance
  verification:
    single_variable: true
    checked: true
    issues: &id001 []
- id: general_illuminance
  desc: 'What is the indoor illuminance level? (split: what is the indoor illuminance level?)'
  variables:
  - what is the indoor illuminance level?
  origin: split of illuminance
  verification:
    single_variable: true
    checked: true
    issues: *id001
