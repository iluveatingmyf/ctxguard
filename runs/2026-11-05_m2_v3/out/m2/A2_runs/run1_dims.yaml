  - what time of day is it?
  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: user_activity
  desc: What is the user doing?
  variables:
  - what is the user doing?
  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: door_status
  desc: Is the door closed or open?
  variables:
  - is the door closed or open?
  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: dangerous_events
  desc: What dangerous or abnormal event is happening in the home or laundry room?
  variables: &id008
  - what dangerous event is happening in the home?
  - what is happening at the doors?
  origin: grouped
  verification:
    single_variable: false
    checked: true
    reason: Members ask different situation questions. Member 0 asks about dangerous events in the home, while Member 1 asks
      about specific events at the doors.
    issues: &id009 []
- id: vacation_mode
  desc: Is the home in vacation mode?
  variables:
  - is the home in vacation mode?
  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: user_location
