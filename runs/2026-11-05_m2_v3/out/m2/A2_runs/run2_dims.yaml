dims:
- id: abnormal_events
  desc: What abnormal or dangerous event is happening in the home, laundry room, or basement?
  variables: &id003
  - what abnormal or dangerous event is happening around the basement and laundry room?
  - what are the people in the room doing?
  - what abnormal or dangerous event is happening in the laundry room?
  - what abnormal or dangerous event is happening in the home?
  origin: grouped
  verification:
    single_variable: false
    checked: true
    reason: Members 1 and 0 ask about the basement and laundry room, while members 2 and 3 ask about the laundry room and
      home respectively, not making them mutually exclusive alternatives for a single situation question.
    issues: &id004 []
- id: door_status
  desc: Is the door closed or open, or what is the security status of the door according to the camera?
  variables: &id005
  - is the door closed or open?
  - what is the security status of the door according to the camera?
  - what is the status of the doors?
  origin: grouped
  verification:
    single_variable: false
    checked: true
    reason: Members 0 and 1 ask about the door's physical state (closed or open) and security status (according to the camera),
      while member 2 asks about the status of multiple doors, which is a different situation question.
    issues: &id006 []
- id: motion
  desc: Is there any motion in the room?
  variables:
  - is there any motion in the room?
  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: temperature
  desc: How warm or cold is the room?
  variables:
  - how warm or cold is the room?
  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: specific_mode
  desc: Is the home in a specific mode for nighttime?
  variables:
  - is the home in a specific mode for nighttime?
  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: user_presence
  desc: Is the user near the house?
  variables:
  - is the user near the house?
  origin: grouped
  verification:
    single_variable: true
    checked: false
    issues: []
- id: dangerous_event
  desc: What dangerous event is happening in the home?
  variables: &id007
  - what dangerous event is happening in the home?
  - what is the air quality in the home?
  origin: grouped
  verification:
    single_variable: false
    checked: true
    reason: Member 0 asks about a dangerous event, while Member 1 asks about air quality, which is not a dangerous event.
    issues: &id008 []
- id: what_is_the_state_of_the_water_sensor
  desc: what is the state of the water sensor?
  variables:
  - what is the state of the water sensor?
  origin: unassigned by the grouping call
  verification:
    single_variable: true
    checked: false
    issues: []
- id: what_is_the_indoor_illuminance_level
  desc: what is the indoor illuminance level?
  variables:
  - what is the indoor illuminance level?
  origin: unassigned by the grouping call
  verification:
    single_variable: true
    checked: false
    issues: []
- id: light_change
  desc: 'What are the people in the room doing, at home, or doing in the home? (split: what is the change in light level?)'
  variables:
  - what is the change in light level?
  origin: split of people_presence
  verification:
    single_variable: true
    checked: true
    issues: &id001 []
- id: people_activity
  desc: 'What are the people in the room doing, at home, or doing in the home? (split: what are the people doing?; is anyone
    at home?)'
  variables:
  - what are the people doing?
  - is anyone at home?
  origin: split of people_presence
  verification:
    single_variable: true
    checked: true
    issues: *id001
- id: time_of_day
  desc: 'What time of day is it, or what is the indoor illuminance level during the daytime? (split: what time of day is it?)'
  variables:
  - what time of day is it?
  origin: split of time_of_day
  verification:
    single_variable: true
    checked: true
    issues: &id002 []
- id: illuminance_level
  desc: 'What time of day is it, or what is the indoor illuminance level during the daytime? (split: what is the indoor illuminance
    level during the daytime?)'
  variables:
  - what is the indoor illuminance level during the daytime?
  origin: split of time_of_day
  verification:
    single_variable: true
    checked: true
    issues: *id002
