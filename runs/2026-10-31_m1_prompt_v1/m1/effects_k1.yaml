version: E-k1
samples: 1
rejected_out_of_vocab: 3
effects:
- id: air_exchange:decrease
  channel: air_exchange
  direction: decrease
  desc: decrease of air exchange (Rate of air exchange between indoor zone and outdoors (ventilation).)
  preconditions:
    close_window: always
    close_blind: always
    close_garage: The garage door was open.
    heat_on: always
    hvac_off: always
    light_on: always
    light_off: always
    outlet_on: outlet is in a closed room with no windows or doors
    outlet_off: always
    stove_off: always
    water_valve_close: always
    gas_valve_close: always
    humidifier_on: always
- id: air_exchange:increase
  channel: air_exchange
  direction: increase
  desc: increase of air exchange (Rate of air exchange between indoor zone and outdoors (ventilation).)
  preconditions:
    open_window: always
    open_blind: always
    open_garage: always
    unlock_door: always
    cool_on: always
    fan_on: always
    exhaust_fan_on: always
    outlet_on: outlet is near a window or door that is open
    water_valve_open: always
    media_play: always
    vacuum_start: always
- id: gas_flow:decrease
  channel: gas_flow
  direction: decrease
  desc: decrease of gas flow (Fuel gas supplied through piping.)
  preconditions:
    gas_valve_close: always
- id: heat_source:decrease
  channel: heat_source
  direction: decrease
  desc: decrease of heat source (An active heating element or open flame is running (stove, oven, space heater).)
  preconditions:
    light_on: ambient temperature is above comfort threshold
    outlet_off: always
    stove_off: always
    gas_valve_close: always
- id: heat_source:increase
  channel: heat_source
  direction: increase
  desc: increase of heat source (An active heating element or open flame is running (stove, oven, space heater).)
  preconditions:
    heat_on: always
    light_on: ambient temperature is below comfort threshold
- id: illumination:decrease
  channel: illumination
  direction: decrease
  desc: decrease of illumination (Light level inside the zone.)
  preconditions:
    close_blind: always
    cool_on: always
    fan_on: always
    light_off: always
    outlet_off: always
    media_play: media content is video with dark scenes
- id: illumination:increase
  channel: illumination
  direction: increase
  desc: increase of illumination (Light level inside the zone.)
  preconditions:
    open_blind: always
    light_on: always
    outlet_on: outlet is connected to a light
    siren_on: always
    media_play: media content is video with bright scenes
- id: indoor_humidity:decrease
  channel: indoor_humidity
  direction: decrease
  desc: decrease of indoor humidity (Relative humidity of the indoor zone.)
  preconditions:
    open_window: when outdoor humidity is lower than indoor humidity
    close_window: always
    exhaust_fan_on: always
    water_valve_close: always
- id: indoor_humidity:increase
  channel: indoor_humidity
  direction: increase
  desc: increase of indoor humidity (Relative humidity of the indoor zone.)
  preconditions:
    open_window: when outdoor humidity is higher than indoor humidity
    fan_on: always
    humidifier_on: always
- id: indoor_temperature:decrease
  channel: indoor_temperature
  direction: decrease
  desc: decrease of indoor temperature (Air temperature of the indoor zone.)
  preconditions:
    open_window: when outdoor temperature is lower than indoor temperature
    close_window: outside temperature is lower than indoor temperature
    open_blind: outdoor_temperature < indoor_temperature
    close_blind: always
    cool_on: always
    hvac_off: always
    fan_on: always
    exhaust_fan_on: always
    light_on: ambient temperature is above comfort threshold
    light_off: ambient temperature is higher than indoor temperature
    outlet_on: outlet is connected to a cooling device
    stove_off: always
    water_valve_close: water_valve_close is performed during heating or when the indoor temperature is above the outdoor temperature
    water_valve_open: water_flow is increased and the outdoor temperature is lower than the indoor temperature
    gas_valve_close: always
    media_play: media content is video or has low audio volume
    vacuum_start: always
    humidifier_on: ambient temperature is higher than indoor temperature
- id: indoor_temperature:increase
  channel: indoor_temperature
  direction: increase
  desc: increase of indoor temperature (Air temperature of the indoor zone.)
  preconditions:
    open_window: when outdoor temperature is higher than indoor temperature
    close_window: outside temperature is higher than indoor temperature
    open_blind: outdoor_temperature > indoor_temperature
    heat_on: always
    light_on: ambient temperature is below comfort threshold
    light_off: ambient temperature is lower than indoor temperature
    outlet_on: outlet is connected to a heating device
    water_valve_close: water_valve_close is performed during cooling or when the indoor temperature is below the outdoor temperature
    water_valve_open: water_flow is increased and the outdoor temperature is higher than the indoor temperature
    media_play: media content is video or has high audio volume
    humidifier_on: ambient temperature is lower than indoor temperature
- id: info_disclosure:decrease
  channel: info_disclosure
  direction: decrease
  desc: decrease of info disclosure (Information emitted outside the device (spoken announcement, notification, upload).)
  preconditions:
    lock_door: The door has a notification system that can send information outside.
    exhaust_fan_on: always
    water_valve_close: always
    alarm_disarm: always
- id: info_disclosure:increase
  channel: info_disclosure
  direction: increase
  desc: increase of info disclosure (Information emitted outside the device (spoken announcement, notification, upload).)
  preconditions:
    water_valve_open: always
    alarm_arm_away: always
    camera_on: always
    media_play: media content includes spoken announcements or notifications
    tts_announce: always
- id: mechanical_motion:decrease
  channel: mechanical_motion
  direction: decrease
  desc: decrease of mechanical motion (Moving machinery that can collide with or trap people/pets (robot vacuum, garage door,
    motorized covers).)
  preconditions:
    lock_door: The door has a motorized mechanism that can move.
    outlet_off: always
- id: mechanical_motion:increase
  channel: mechanical_motion
  direction: increase
  desc: increase of mechanical motion (Moving machinery that can collide with or trap people/pets (robot vacuum, garage door,
    motorized covers).)
  preconditions:
    open_garage: always
    cool_on: always
    outlet_on: outlet is connected to a motorized device
    water_valve_open: the valve is connected to a water-powered mechanism (e.g., a toilet)
    vacuum_start: always
- id: passage_opening:decrease
  channel: passage_opening
  direction: decrease
  desc: decrease of passage opening (Physical openness of a passage between outside and inside (door, window, garage) - who/what
    can pass.)
  preconditions:
    close_window: always
    open_blind: always
    close_garage: The garage door was open.
    lock_door: The door is unlocked and can be opened by an intruder.
    heat_on: always
    fan_on: always
    exhaust_fan_on: always
    light_off: window or door is open
    gas_valve_close: always
    alarm_arm_away: always
- id: passage_opening:increase
  channel: passage_opening
  direction: increase
  desc: increase of passage opening (Physical openness of a passage between outside and inside (door, window, garage) - who/what
    can pass.)
  preconditions:
    open_window: always
    open_garage: always
    unlock_door: always
    alarm_disarm: always
- id: power_supply:decrease
  channel: power_supply
  direction: decrease
  desc: decrease of power supply (Electrical power delivered to a load (outlet, appliance, device).)
  preconditions:
    hvac_off: always
    light_off: always
    outlet_off: always
    stove_off: always
    gas_valve_close: always
- id: power_supply:increase
  channel: power_supply
  direction: increase
  desc: increase of power supply (Electrical power delivered to a load (outlet, appliance, device).)
  preconditions:
    heat_on: always
    cool_on: always
    fan_on: always
    light_on: always
    outlet_on: always
- id: security_monitoring:decrease
  channel: security_monitoring
  direction: decrease
  desc: decrease of security monitoring (Intrusion monitoring / alarm protection of the home.)
  preconditions:
    open_garage: always
    unlock_door: always
    water_valve_close: always
    alarm_disarm: always
- id: security_monitoring:increase
  channel: security_monitoring
  direction: increase
  desc: increase of security monitoring (Intrusion monitoring / alarm protection of the home.)
  preconditions:
    lock_door: Always
    water_valve_open: always
    alarm_arm_away: always
    siren_on: always
- id: sensing_capture:decrease
  channel: sensing_capture
  direction: decrease
  desc: decrease of sensing capture (Audio/video capture of the occupants and the home.)
  preconditions:
    open_window: when outdoor lighting is worse than indoor lighting
    close_window: always
    lock_door: The door has a camera or sensor that can be accessed from the outside.
    exhaust_fan_on: always
    water_valve_close: always
    alarm_disarm: always
- id: sensing_capture:increase
  channel: sensing_capture
  direction: increase
  desc: increase of sensing capture (Audio/video capture of the occupants and the home.)
  preconditions:
    open_window: when outdoor lighting is better than indoor lighting
    light_on: always
    water_valve_open: always
    alarm_arm_away: always
    camera_on: always
    media_play: camera is enabled and media content is video
- id: sound:decrease
  channel: sound
  direction: decrease
  desc: decrease of sound (Acoustic emission inside the home.)
  preconditions:
    open_window: when outdoor noise level is lower than indoor noise level
    close_garage: The garage door was open.
    media_play: media content has low volume
- id: sound:increase
  channel: sound
  direction: increase
  desc: increase of sound (Acoustic emission inside the home.)
  preconditions:
    open_window: when outdoor noise level is higher than indoor noise level
    siren_on: always
    media_play: media content has high volume
    tts_announce: always
    vacuum_start: always
- id: visibility:decrease
  channel: visibility
  direction: decrease
  desc: decrease of visibility (How much of the indoor space can be seen from outside.)
  preconditions:
    close_window: always
    close_blind: always
    close_garage: The garage door was open.
- id: visibility:increase
  channel: visibility
  direction: increase
  desc: increase of visibility (How much of the indoor space can be seen from outside.)
  preconditions:
    open_window: always
- id: water_flow:decrease
  channel: water_flow
  direction: decrease
  desc: decrease of water flow (Water supplied through plumbing.)
  preconditions:
    water_valve_close: always
- id: water_flow:increase
  channel: water_flow
  direction: increase
  desc: increase of water flow (Water supplied through plumbing.)
  preconditions:
    water_valve_open: always
