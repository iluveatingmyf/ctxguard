version: E-k3
samples: 3
rejected_out_of_vocab: 19
effects:
- id: air_exchange:decrease
  channel: air_exchange
  direction: decrease
  desc: decrease of air exchange (Rate of air exchange between indoor zone and outdoors (ventilation).)
  preconditions:
    close_window: always
    close_blind: always
    open_garage: The garage door was already open.
    close_garage: The garage door is open and there is a significant difference in air quality between the garage and the
      indoor zone.
    heat_on: always
    hvac_off: always
    light_off: always
    outlet_off: always
    stove_off: always
    water_valve_close: always
    gas_valve_close: always
    humidifier_on: always
- id: air_exchange:increase
  channel: air_exchange
  direction: increase
  desc: increase of air exchange (Rate of air exchange between indoor zone and outdoors (ventilation).)
  preconditions:
    open_window: always
    open_blind: always
    open_garage: The garage door was closed.
    unlock_door: The door was locked
    cool_on: Always
    fan_on: always
    exhaust_fan_on: always
    outlet_on: the outlet is used by a device that requires ventilation, such as a fan or dehumidifier
    water_valve_open: always
    vacuum_start: always
- id: gas_flow:decrease
  channel: gas_flow
  direction: decrease
  desc: decrease of gas flow (Fuel gas supplied through piping.)
  preconditions:
    gas_valve_close: always
- id: heat_source:decrease
  channel: heat_source
  direction: decrease
  desc: decrease of heat source (An active heating element or open flame is running (stove, oven, space heater).)
  preconditions:
    stove_off: always
    gas_valve_close: always
- id: heat_source:increase
  channel: heat_source
  direction: increase
  desc: increase of heat source (An active heating element or open flame is running (stove, oven, space heater).)
  preconditions:
    heat_on: always
- id: illumination:decrease
  channel: illumination
  direction: decrease
  desc: decrease of illumination (Light level inside the zone.)
  preconditions:
    close_blind: always
    fan_on: when the fan is not placed in a lighted area
    exhaust_fan_on: always
    light_off: always
    outlet_off: always
- id: illumination:increase
  channel: illumination
  direction: increase
  desc: increase of illumination (Light level inside the zone.)
  preconditions:
    open_blind: always
    light_on: always
- id: indoor_humidity:decrease
  channel: indoor_humidity
  direction: decrease
  desc: decrease of indoor humidity (Relative humidity of the indoor zone.)
  preconditions:
    open_window: 室外湿度低于室内湿度
    close_window: outdoor relative humidity is lower than indoor relative humidity
    fan_on: always
- id: indoor_humidity:increase
  channel: indoor_humidity
  direction: increase
  desc: increase of indoor humidity (Relative humidity of the indoor zone.)
  preconditions:
    open_window: 室外湿度高于室内湿度
    fan_on: when the outdoor humidity is higher than the indoor humidity
    humidifier_on: always
- id: indoor_temperature:decrease
  channel: indoor_temperature
  direction: decrease
  desc: decrease of indoor temperature (Air temperature of the indoor zone.)
  preconditions:
    open_window: 室外温度低于室内温度
    close_window: outdoor temperature is lower than indoor temperature
    open_blind: window is present and exposed to cooler outdoor temperature
    close_blind: ambient_temperature < indoor_temperature
    open_garage: The outdoor temperature is lower than the indoor temperature.
    cool_on: Always
    hvac_off: always
    fan_on: when the indoor temperature is higher than the outdoor temperature
    exhaust_fan_on: always
    outlet_off: outlet was heating the indoor zone
    stove_off: always
    water_valve_close: water_flow is currently high
    water_valve_open: ambient temperature is lower than indoor temperature
    gas_valve_close: always
    vacuum_start: always
    humidifier_on: air_exchange is high
- id: indoor_temperature:increase
  channel: indoor_temperature
  direction: increase
  desc: increase of indoor temperature (Air temperature of the indoor zone.)
  preconditions:
    open_window: 室外温度高于室内温度
    close_window: outdoor temperature is higher than indoor temperature
    open_blind: window is present and exposed to warmer outdoor temperature
    close_blind: ambient_temperature > indoor_temperature
    open_garage: The outdoor temperature is higher than the indoor temperature.
    heat_on: always
    fan_on: when the indoor temperature is lower than the outdoor temperature
    outlet_on: the outlet is used by a device that generates heat, such as a heater or space heater
    outlet_off: outlet was cooling the indoor zone
    water_valve_close: water_flow is currently low
    water_valve_open: ambient temperature is higher than indoor temperature
    media_play: Always
    humidifier_on: air_exchange is low
- id: info_disclosure:decrease
  channel: info_disclosure
  direction: decrease
  desc: decrease of info disclosure (Information emitted outside the device (spoken announcement, notification, upload).)
  preconditions:
    lock_door: The door was unlocked
    light_off: always
    gas_valve_close: always
    alarm_disarm: always
- id: info_disclosure:increase
  channel: info_disclosure
  direction: increase
  desc: increase of info disclosure (Information emitted outside the device (spoken announcement, notification, upload).)
  preconditions:
    heat_on: always
    water_valve_open: the water valve is activated by a voice command or app notification
    alarm_arm_away: always
    siren_on: always
    camera_on: always
    tts_announce: always
- id: mechanical_motion:increase
  channel: mechanical_motion
  direction: increase
  desc: increase of mechanical motion (Moving machinery that can collide with or trap people/pets (robot vacuum, garage door,
    motorized covers).)
  preconditions:
    open_garage: The garage door motor is operational.
    close_garage: The garage door is motorized.
    fan_on: always
    vacuum_start: always
- id: passage_opening:decrease
  channel: passage_opening
  direction: decrease
  desc: decrease of passage opening (Physical openness of a passage between outside and inside (door, window, garage) - who/what
    can pass.)
  preconditions:
    close_window: always
    close_blind: always
    close_garage: The garage door is open.
    lock_door: The door was open
    alarm_arm_away: always
- id: passage_opening:increase
  channel: passage_opening
  direction: increase
  desc: increase of passage opening (Physical openness of a passage between outside and inside (door, window, garage) - who/what
    can pass.)
  preconditions:
    open_window: always
    open_garage: The garage door was closed.
    unlock_door: The door was locked
    exhaust_fan_on: always
- id: power_supply:decrease
  channel: power_supply
  direction: decrease
  desc: decrease of power supply (Electrical power delivered to a load (outlet, appliance, device).)
  preconditions:
    hvac_off: always
    outlet_off: always
    stove_off: always
    gas_valve_close: always
- id: power_supply:increase
  channel: power_supply
  direction: increase
  desc: increase of power supply (Electrical power delivered to a load (outlet, appliance, device).)
  preconditions:
    heat_on: always
    cool_on: Always
    outlet_on: always
- id: security_monitoring:decrease
  channel: security_monitoring
  direction: decrease
  desc: decrease of security monitoring (Intrusion monitoring / alarm protection of the home.)
  preconditions:
    open_garage: The garage door was closed and now is open.
    unlock_door: always
    alarm_disarm: always
- id: security_monitoring:increase
  channel: security_monitoring
  direction: increase
  desc: increase of security monitoring (Intrusion monitoring / alarm protection of the home.)
  preconditions:
    lock_door: always
    alarm_arm_away: always
    siren_on: always
- id: sensing_capture:decrease
  channel: sensing_capture
  direction: decrease
  desc: decrease of sensing capture (Audio/video capture of the occupants and the home.)
  preconditions:
    close_window: always
    lock_door: The door was unlocked
    light_off: camera or sensor is installed
    gas_valve_close: always
    alarm_disarm: always
- id: sensing_capture:increase
  channel: sensing_capture
  direction: increase
  desc: increase of sensing capture (Audio/video capture of the occupants and the home.)
  preconditions:
    open_window: always
    heat_on: always
    light_on: always
    water_valve_open: always
    alarm_arm_away: always
    siren_on: always
    camera_on: always
    vacuum_start: always
- id: sound:increase
  channel: sound
  direction: increase
  desc: increase of sound (Acoustic emission inside the home.)
  preconditions:
    open_garage: always
    fan_on: always
    exhaust_fan_on: always
    light_on: light fixture contains a device that emits sound, e.g., nightlight with a chime
    outlet_on: the outlet is used by a device that emits sound, such as a speaker or vacuum cleaner
    siren_on: always
    media_play: Always
    tts_announce: always
    vacuum_start: always
- id: visibility:decrease
  channel: visibility
  direction: decrease
  desc: decrease of visibility (How much of the indoor space can be seen from outside.)
  preconditions:
    close_window: always
- id: visibility:increase
  channel: visibility
  direction: increase
  desc: increase of visibility (How much of the indoor space can be seen from outside.)
  preconditions:
    open_window: always
    open_blind: window is open
    open_garage: The outdoor environment is visible from inside the home.
- id: water_flow:decrease
  channel: water_flow
  direction: decrease
  desc: decrease of water flow (Water supplied through plumbing.)
  preconditions:
    water_valve_close: always
- id: water_flow:increase
  channel: water_flow
  direction: increase
  desc: increase of water flow (Water supplied through plumbing.)
  preconditions:
    water_valve_open: always
