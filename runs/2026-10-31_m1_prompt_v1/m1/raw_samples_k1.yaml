    direction: increase
    precondition: always
  - channel: indoor_temperature
    direction: increase
    precondition: media content is video or has high audio volume
  - channel: indoor_temperature
    direction: decrease
    precondition: media content is video or has low audio volume
  - channel: illumination
    direction: increase
    precondition: media content is video with bright scenes
  - channel: illumination
    direction: decrease
    precondition: media content is video with dark scenes
  - channel: sound
    direction: increase
