template:
- sensor:
  - name: ctx_time_period_home
    state: '{% if (2 if (now().strftime(''%H:%M'') >= ''22:30'' or now().strftime(''%H:%M'') < ''06:30'') else 0) == 2 %}night{% elif (2 if (now().strftime(''%H:%M'') >= ''22:30'' or now().strftime(''%H:%M'') < ''06:30'') else 0) == 1 %}unknown{% else %}day{% endif %}'
  - name: ctx_home_occupancy_home
    state: '{% if ([(1 if states(''person.jordan'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''person.jordan'') == ''home'' else 0)), (1 if states(''person.casey'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''person.casey'') == ''home'' else 0))]|max) == 2 %}occupied{% elif ([(1 if states(''person.jordan'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''person.jordan'') == ''home'' else 0)), (1 if states(''person.casey'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''person.casey'') == ''home'' else 0))]|max) == 1 %}unknown{% else %}away{% endif %}'
  - name: ctx_zone_occupant_bedroom
    state: unknown
  - name: ctx_zone_occupant_living_room
    state: '{% if (1 if states(''binary_sensor.living_motion'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.living_motion'') == ''on'' else 0)) == 2 %}awake{% elif (1 if states(''binary_sensor.living_motion'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.living_motion'') == ''on'' else 0)) == 1 %}unknown{% else %}unknown{% endif %}'
  - name: ctx_zone_occupant_kitchen
    state: unknown
  - name: ctx_zone_occupant_bathroom
    state: unknown
  - name: ctx_zone_occupant_entrance
    state: '{% if (1 if states(''binary_sensor.entrance_motion'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.entrance_motion'') == ''on'' else 0)) == 2 %}awake{% elif (1 if states(''binary_sensor.entrance_motion'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.entrance_motion'') == ''on'' else 0)) == 1 %}unknown{% else %}unknown{% endif %}'
  - name: ctx_vulnerable_present_bedroom
    state: unknown
  - name: ctx_vulnerable_present_living_room
    state: unknown
  - name: ctx_vulnerable_present_kitchen
    state: unknown
  - name: ctx_vulnerable_present_bathroom
    state: unknown
  - name: ctx_vulnerable_present_entrance
    state: unknown
  - name: ctx_active_hazard_home
    state: '{% if ([([(1 if states(''binary_sensor.kitchen_smoke'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.kitchen_smoke'') == ''on'' else 0))]|max), (1 if states(''switch.cooktop'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''switch.cooktop'') == ''on'' else 0))]|min) == 2 %}cooking_fumes{% elif ([([(1 if states(''binary_sensor.kitchen_smoke'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.kitchen_smoke'') == ''on'' else 0))]|max), (1 if states(''switch.cooktop'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''switch.cooktop'') == ''on'' else 0))]|min) == 1 %}unknown{% else %}{% if ([(1 if states(''binary_sensor.kitchen_smoke'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.kitchen_smoke'') == ''on'' else 0))]|max) == 2 %}fire{% elif ([(1 if states(''binary_sensor.kitchen_smoke'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.kitchen_smoke'') == ''on'' else 0))]|max) == 1 %}unknown{% else %}{% if ([(1 if states(''binary_sensor.bathroom_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.bathroom_leak'') == ''on'' else 0))]|max) == 2 %}water_leak{% elif ([(1 if states(''binary_sensor.bathroom_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.bathroom_leak'') == ''on'' else 0))]|max) == 1 %}unknown{% else %}none{% endif %}{% endif %}{% endif %}'
  - name: ctx_outdoor_condition_home
    state: '{% if (1 if states(''weather.home'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''weather.home'') in [''pouring'', ''lightning-rainy''] else 0)) == 2 %}rain_storm{% elif (1 if states(''weather.home'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''weather.home'') in [''pouring'', ''lightning-rainy''] else 0)) == 1 %}unknown{% else %}benign{% endif %}'
  - name: ctx_indoor_air_bedroom
    state: '{% if (1 if not is_number(states(''sensor.bedroom_co2'')) else (2 if states(''sensor.bedroom_co2'')|float > 1000.0 else 0)) == 2 %}poor{% elif (1 if not is_number(states(''sensor.bedroom_co2'')) else (2 if states(''sensor.bedroom_co2'')|float > 1000.0 else 0)) == 1 %}unknown{% else %}good{% endif %}'
  - name: ctx_indoor_air_living_room
    state: unknown
  - name: ctx_indoor_air_kitchen
    state: unknown
  - name: ctx_indoor_air_bathroom
    state: '{% if (1 if not is_number(states(''sensor.bathroom_humidity'')) else (2 if states(''sensor.bathroom_humidity'')|float > 75.0 else 0)) == 2 %}poor{% elif (1 if not is_number(states(''sensor.bathroom_humidity'')) else (2 if states(''sensor.bathroom_humidity'')|float > 75.0 else 0)) == 1 %}unknown{% else %}good{% endif %}'
  - name: ctx_indoor_air_entrance
    state: unknown
  - name: ctx_indoor_thermal_bedroom
    state: '{% if (1 if not is_number(states(''sensor.bedroom_temperature'')) else (2 if states(''sensor.bedroom_temperature'')|float < 17.0 else 0)) == 2 %}cold{% elif (1 if not is_number(states(''sensor.bedroom_temperature'')) else (2 if states(''sensor.bedroom_temperature'')|float < 17.0 else 0)) == 1 %}unknown{% else %}{% if (1 if not is_number(states(''sensor.bedroom_temperature'')) else (2 if states(''sensor.bedroom_temperature'')|float > 28.0 else 0)) == 2 %}hot{% elif (1 if not is_number(states(''sensor.bedroom_temperature'')) else (2 if states(''sensor.bedroom_temperature'')|float > 28.0 else 0)) == 1 %}unknown{% else %}comfortable{% endif %}{% endif %}'
  - name: ctx_indoor_thermal_living_room
    state: '{% if (1 if not is_number(states(''sensor.living_temperature'')) else (2 if states(''sensor.living_temperature'')|float < 17.0 else 0)) == 2 %}cold{% elif (1 if not is_number(states(''sensor.living_temperature'')) else (2 if states(''sensor.living_temperature'')|float < 17.0 else 0)) == 1 %}unknown{% else %}{% if (1 if not is_number(states(''sensor.living_temperature'')) else (2 if states(''sensor.living_temperature'')|float > 28.0 else 0)) == 2 %}hot{% elif (1 if not is_number(states(''sensor.living_temperature'')) else (2 if states(''sensor.living_temperature'')|float > 28.0 else 0)) == 1 %}unknown{% else %}comfortable{% endif %}{% endif %}'
  - name: ctx_indoor_thermal_kitchen
    state: unknown
  - name: ctx_indoor_thermal_bathroom
    state: unknown
  - name: ctx_indoor_thermal_entrance
    state: unknown
  - name: ctx_zone_occupant_home
    state: '{% set v = [states(''sensor.ctx_zone_occupant_bedroom''), states(''sensor.ctx_zone_occupant_living_room''), states(''sensor.ctx_zone_occupant_kitchen''), states(''sensor.ctx_zone_occupant_bathroom''), states(''sensor.ctx_zone_occupant_entrance'')] %}{% if ''asleep'' in v %}asleep{% elif ''unknown'' in v %}unknown{% elif ''awake'' in v %}awake{% elif ''empty'' in v %}empty{% else %}unknown{% endif %}'
  - name: ctx_vulnerable_present_home
    state: '{% set v = [states(''sensor.ctx_vulnerable_present_bedroom''), states(''sensor.ctx_vulnerable_present_living_room''), states(''sensor.ctx_vulnerable_present_kitchen''), states(''sensor.ctx_vulnerable_present_bathroom''), states(''sensor.ctx_vulnerable_present_entrance'')] %}{% if ''yes'' in v %}yes{% elif ''unknown'' in v %}unknown{% elif ''no'' in v %}no{% else %}unknown{% endif %}'
  - name: ctx_indoor_air_home
    state: '{% set v = [states(''sensor.ctx_indoor_air_bedroom''), states(''sensor.ctx_indoor_air_living_room''), states(''sensor.ctx_indoor_air_kitchen''), states(''sensor.ctx_indoor_air_bathroom''), states(''sensor.ctx_indoor_air_entrance'')] %}{% if ''poor'' in v %}poor{% elif ''unknown'' in v %}unknown{% elif ''good'' in v %}good{% else %}unknown{% endif %}'
  - name: ctx_indoor_thermal_home
    state: '{% set v = [states(''sensor.ctx_indoor_thermal_bedroom''), states(''sensor.ctx_indoor_thermal_living_room''), states(''sensor.ctx_indoor_thermal_kitchen''), states(''sensor.ctx_indoor_thermal_bathroom''), states(''sensor.ctx_indoor_thermal_entrance'')] %}{% if ''cold'' in v %}cold{% elif ''unknown'' in v %}unknown{% elif ''hot'' in v %}hot{% elif ''comfortable'' in v %}comfortable{% else %}unknown{% endif %}'
  - name: ctx_indoor_air_bedroom_indep_l2_r01
    state: '{% if 1 == 2 %}poor{% elif 1 == 1 %}unknown{% else %}good{% endif %}'
  - name: ctx_indoor_air_living_room_indep_l2_r01
    state: unknown
  - name: ctx_indoor_air_kitchen_indep_l2_r01
    state: unknown
  - name: ctx_indoor_air_bathroom_indep_l2_r01
