  alias: Play music in the living room when someone enters
  trigger:
  - platform: state
    entity_id: binary_sensor.living_motion
    to: 'on'
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.ctx_zone_occupant_living_room'') in [''unknown'', ''asleep''] }}'
      sequence:
      - service: notify.notify
        data:
          message: '[Play music in the living room when someone enters] needs confirmation'
      alias: ask
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.ctx_zone_occupant_living_room'') in [''awake'', ''empty''] }}'
      sequence:
      - service: media_player.play_media
        target:
          entity_id: media_player.living_speaker
        data:
          media_content_id: playlist
          media_content_type: music
      alias: execute
