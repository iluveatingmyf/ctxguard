automation:
- id: L2_r01_hardened
  alias: Ventilate bedroom when CO2 is high
  trigger:
  - platform: numeric_state
    entity_id: sensor.bedroom_co2
    above: 1000
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.ctx_home_occupancy_home'') in [''unknown'', ''away''] and states(''sensor.ctx_active_hazard_home'') in [''unknown'', ''cooking_fumes'', ''fire'', ''intrusion'', ''none'', ''water_leak''] and states(''sensor.ctx_indoor_air_bedroom'') in [''unknown'', ''poor''] and states(''sensor.ctx_indoor_air_bedroom_indep_l2_r01'') in [''unknown''] }}'
      sequence:
      - service: notify.notify
        data:
          message: '[Ventilate bedroom when CO2 is high] needs confirmation'
      alias: ask
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.ctx_outdoor_condition_home'') in [''polluted''] and states(''sensor.ctx_indoor_air_bedroom'') in [''unknown'', ''poor''] and states(''sensor.ctx_indoor_air_bedroom_indep_l2_r01'') in [''unknown'', ''poor''] }}'
