  - name: ctx_indoor_air_home_indep_l2_r01
    state: '{% set v = [states(''sensor.ctx_indoor_air_bedroom_indep_l2_r01''), states(''sensor.ctx_indoor_air_living_room_indep_l2_r01''), states(''sensor.ctx_indoor_air_kitchen_indep_l2_r01''), states(''sensor.ctx_indoor_air_bathroom_indep_l2_r01''), states(''sensor.ctx_indoor_air_entrance_indep_l2_r01'')] %}{% if ''poor'' in v %}poor{% elif ''unknown'' in v %}unknown{% elif ''good'' in v %}good{% else %}unknown{% endif %}'
  - name: ctx_active_hazard_home_indep_l2_r02
    state: '{% if ([([1]|max), (1 if states(''switch.cooktop'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''switch.cooktop'') == ''on'' else 0))]|min) == 2 %}cooking_fumes{% elif ([([1]|max), (1 if states(''switch.cooktop'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''switch.cooktop'') == ''on'' else 0))]|min) == 1 %}unknown{% else %}{% if ([1]|max) == 2 %}fire{% elif ([1]|max) == 1 %}unknown{% else %}{% if ([(1 if states(''binary_sensor.bathroom_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.bathroom_leak'') == ''on'' else 0))]|max) == 2 %}water_leak{% elif ([(1 if states(''binary_sensor.bathroom_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.bathroom_leak'') == ''on'' else 0))]|max) == 1 %}unknown{% else %}none{% endif %}{% endif %}{% endif %}'
  - name: ctx_active_hazard_home_indep_l2_r03
    state: '{% if ([([1]|max), (1 if states(''switch.cooktop'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''switch.cooktop'') == ''on'' else 0))]|min) == 2 %}cooking_fumes{% elif ([([1]|max), (1 if states(''switch.cooktop'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''switch.cooktop'') == ''on'' else 0))]|min) == 1 %}unknown{% else %}{% if ([1]|max) == 2 %}fire{% elif ([1]|max) == 1 %}unknown{% else %}{% if ([(1 if states(''binary_sensor.bathroom_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.bathroom_leak'') == ''on'' else 0))]|max) == 2 %}water_leak{% elif ([(1 if states(''binary_sensor.bathroom_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.bathroom_leak'') == ''on'' else 0))]|max) == 1 %}unknown{% else %}none{% endif %}{% endif %}{% endif %}'
