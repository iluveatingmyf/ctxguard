r.kitchen_smoke'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.kitchen_smoke'') == ''on'' else 0)), (1 if states(''binary_sensor.hallway_smoke'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.hallway_smoke'') == ''on'' else 0))]|max) == 1 %}unknown{% else %}{% if ([(1 if states(''binary_sensor.bathroom_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.bathroom_leak'') == ''on'' else 0)), (1 if states(''binary_sensor.laundry_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.laundry_leak'') == ''on'' else 0)), (1 if states(''binary_sensor.kitchen_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.kitchen_leak'') == ''on'' else 0))]|max) == 2 %}water_leak{% elif ([(1 if states(''binary_sensor.bathroom_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.bathroom_leak'') == ''on'' else 0)), (1 if states(''binary_sensor.laundry_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.laundry_leak'') == ''on'' else 0)), (1 if states(''binary_sensor.kitchen_leak'') in [''none'', ''unavailable'', ''unknown''] else (2 if states(''binary_sensor.kitchen_leak'') == ''on'' else 0))]|max) == 1 %}unknown{% else %}none{% endif %}{% endif %}{% endif %}{% endif %}'
