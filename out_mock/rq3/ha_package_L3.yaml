  trigger:
  - platform: state
    entity_id: binary_sensor.kitchen_smoke
    to: 'on'
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.ctx_active_hazard_home'') in [''unknown''] and states(''sensor.ctx_active_hazard_home_indep_l3_r03'') in [''unknown'', ''fire''] }}'
      sequence:
      - service: notify.notify
        data:
          message: '[Unlock front door for escape when smoke is detected] needs confirmation'
      alias: ask
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.ctx_active_hazard_home_indep_l3_r03'') in [''cooking_fumes'', ''gas_leak'', ''intrusion'', ''none'', ''water_leak''] }}'
      sequence:
      - service: notify.notify
        data:
          message: '[Unlock front door for escape when smoke is detected] blocked'
      alias: block
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.ctx_active_hazard_home'') in [''cooking_fumes'', ''gas_leak'', ''intrusion'', ''none'', ''water_leak''] }}'
      sequence:
      - service: notify.notify
        data:
          message: '[Unlock front door for escape when smoke is detected] blocked'
      alias: block
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.ctx_active_hazard_home'') in [''fire''] and states(''sensor.ctx_active_hazard_home_indep_l3_r03'') in [''unknown'', ''fire''] }}'
      sequence:
      - service: lock.unlock
        target:
          entity_id: lock.front_door
      alias: execute
