layout: L3
vocab_version: F-v0
entries:
- factor: time_period
  area: null
  groundable: true
  rules:
  - value: night
    when:
      time:
      - '22:30'
      - 06:30
  default: day
  invalid_rules: 0
  entities: []
  note: ''
- factor: home_occupancy
  area: null
  groundable: true
  rules:
  - value: occupied
    when:
      any:
      - state: person.alex
        eq: home
      - state: person.sam
        eq: home
      - state: person.grandma
        eq: home
  default: away
  invalid_rules: 0
  entities:
  - person.alex
  - person.grandma
  - person.sam
  note: ''
- factor: zone_occupant
  area: master_bedroom
  groundable: true
  rules:
  - value: asleep
    when:
      state: binary_sensor.master_bed
      eq: 'on'
  - value: awake
    when:
      state: binary_sensor.master_motion
      eq: 'on'
  default: empty
  invalid_rules: 0
  entities:
  - binary_sensor.master_bed
  - binary_sensor.master_motion
  note: ''
- factor: zone_occupant
  area: kids_room
  groundable: true
