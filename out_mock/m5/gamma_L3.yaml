- factor: active_hazard
  area: null
  groundable: true
  rules:
  - value: gas_leak
    when:
      any:
      - state: binary_sensor.kitchen_gas
        eq: 'on'
  - value: cooking_fumes
    when:
      all:
      - any:
        - state: binary_sensor.kitchen_smoke
          eq: 'on'
        - state: binary_sensor.hallway_smoke
          eq: 'on'
      - state: switch.stove
        eq: 'on'
      - num: sensor.kitchen_co
        lt: 50
  - value: fire
    when:
      any:
      - state: binary_sensor.kitchen_smoke
        eq: 'on'
      - state: binary_sensor.hallway_smoke
        eq: 'on'
  - value: water_leak
    when:
      any:
      - state: binary_sensor.bathroom_leak
        eq: 'on'
      - state: binary_sensor.laundry_leak
        eq: 'on'
      - state: binary_sensor.kitchen_leak
        eq: 'on'
  default: none
  invalid_rules: 0
  entities:
  - binary_sensor.bathroom_leak
  - binary_sensor.hallway_smoke
  - binary_sensor.kitchen_gas
  - binary_sensor.kitchen_leak
  - binary_sensor.kitchen_smoke
  - binary_sensor.laundry_leak
  - sensor.kitchen_co
  - switch.stove
  note: ''
- factor: outdoor_condition
  area: null
  groundable: true
  rules:
  - value: rain_storm
    when:
      state: weather.home
      in:
      - pouring
      - lightning-rainy
  - value: cold
    when:
      num: sensor.outdoor_temperature
      lt: 5
  - value: hot
    when:
      num: sensor.outdoor_temperature
      gt: 31
  - value: polluted
    when:
      num: sensor.outdoor_aqi
      gt: 150
  default: benign
  invalid_rules: 0
  entities:
  - sensor.outdoor_aqi
  - sensor.outdoor_temperature
  - weather.home
  note: ''
- factor: indoor_air
