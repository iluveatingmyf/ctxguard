    when:
      num: sensor.bathroom_humidity
      gt: 75
  default: good
  invalid_rules: 0
  entities:
  - sensor.bathroom_humidity
  note: ''
- factor: indoor_air
  area: entrance
  groundable: false
  rules: []
  default: null
  invalid_rules: 0
  entities: []
  note: ''
- factor: indoor_thermal
  area: bedroom
  groundable: true
  rules:
  - value: cold
    when:
      num: sensor.bedroom_temperature
      lt: 17
  - value: hot
    when:
      num: sensor.bedroom_temperature
      gt: 28
  default: comfortable
  invalid_rules: 0
  entities:
