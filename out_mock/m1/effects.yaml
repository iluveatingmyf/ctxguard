  - air_exchange:decrease
  - passage_opening:decrease
  open_blind:
  - illumination:increase
  - visibility:increase
  close_blind:
  - illumination:decrease
  - visibility:decrease
  open_garage:
  - mechanical_motion:increase
  - passage_opening:increase
  close_garage:
  - mechanical_motion:increase
  - passage_opening:decrease
  unlock_door:
  - passage_opening:increase
  lock_door:
  - passage_opening:decrease
  heat_on:
  - heat_source:increase
  - indoor_temperature:increase
  - power_supply:increase
  cool_on:
  - indoor_temperature:decrease
  - power_supply:increase
  hvac_off:
  - power_supply:decrease
  fan_on:
  - indoor_temperature:decrease
  - power_supply:increase
  - sound:increase
  exhaust_fan_on:
  - air_exchange:increase
  - indoor_humidity:decrease
  - sound:increase
  light_on:
  - illumination:increase
  - power_supply:increase
  light_off:
  - illumination:decrease
  outlet_on:
  - power_supply:increase
  outlet_off:
  - power_supply:decrease
