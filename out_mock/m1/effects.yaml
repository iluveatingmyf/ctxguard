version: E-k3
samples: 3
rejected_out_of_vocab: 0
discarded_extra_device: 0
prompt_version: M1-v2 (dedicated system prompt)
effects:
- id: air_exchange:decrease
  channel: air_exchange
  direction: decrease
  desc: decrease of air exchange (Rate of air exchange between indoor zone and outdoors (ventilation).)
  preconditions:
    close_window: always
- id: air_exchange:increase
  channel: air_exchange
  direction: increase
  desc: increase of air exchange (Rate of air exchange between indoor zone and outdoors (ventilation).)
  preconditions:
    open_window: always
    exhaust_fan_on: always
- id: gas_flow:decrease
  channel: gas_flow
  direction: decrease
  desc: decrease of gas flow (Fuel gas supplied through piping.)
  preconditions:
    gas_valve_close: always
- id: heat_source:decrease
  channel: heat_source
  direction: decrease
  desc: decrease of heat source (An active heating element or open flame is running (stove, oven, space heater).)
  preconditions:
    stove_off: always
    gas_valve_close: always
- id: heat_source:increase
  channel: heat_source
  direction: increase
  desc: increase of heat source (An active heating element or open flame is running (stove, oven, space heater).)
  preconditions:
    heat_on: always
- id: illumination:decrease
  channel: illumination
  direction: decrease
  desc: decrease of illumination (Light level inside the zone.)
  preconditions:
    close_blind: always
    light_off: always
- id: illumination:increase
  channel: illumination
  direction: increase
  desc: increase of illumination (Light level inside the zone.)
  preconditions:
    open_blind: always
    light_on: always
- id: indoor_humidity:decrease
  channel: indoor_humidity
  direction: decrease
  desc: decrease of indoor humidity (Relative humidity of the indoor zone.)
  preconditions:
    exhaust_fan_on: always
- id: indoor_humidity:increase
  channel: indoor_humidity
  direction: increase
  desc: increase of indoor humidity (Relative humidity of the indoor zone.)
  preconditions:
    humidifier_on: always
- id: indoor_temperature:decrease
  channel: indoor_temperature
  direction: decrease
  desc: decrease of indoor temperature (Air temperature of the indoor zone.)
  preconditions:
    open_window: always
    cool_on: always
    fan_on: always
- id: indoor_temperature:increase
  channel: indoor_temperature
  direction: increase
  desc: increase of indoor temperature (Air temperature of the indoor zone.)
  preconditions:
    open_window: always
    heat_on: always
- id: info_disclosure:increase
  channel: info_disclosure
  direction: increase
  desc: increase of info disclosure (Information emitted outside the device (spoken announcement, notification, upload).)
  preconditions:
    tts_announce: always
- id: mechanical_motion:increase
  channel: mechanical_motion
  direction: increase
  desc: increase of mechanical motion (Moving machinery that can collide with or trap people/pets (robot vacuum, garage door,
    motorized covers).)
  preconditions:
    open_garage: always
    close_garage: always
    vacuum_start: always
- id: passage_opening:decrease
  channel: passage_opening
  direction: decrease
  desc: decrease of passage opening (Physical openness of a passage between outside and inside (door, window, garage) - who/what
    can pass.)
  preconditions:
    close_window: always
    close_garage: always
    lock_door: always
- id: passage_opening:increase
  channel: passage_opening
  direction: increase
  desc: increase of passage opening (Physical openness of a passage between outside and inside (door, window, garage) - who/what
    can pass.)
  preconditions:
    open_window: always
    open_garage: always
    unlock_door: always
- id: power_supply:decrease
  channel: power_supply
  direction: decrease
  desc: decrease of power supply (Electrical power delivered to a load (outlet, appliance, device).)
  preconditions:
    hvac_off: always
    outlet_off: always
    stove_off: always
- id: power_supply:increase
  channel: power_supply
  direction: increase
  desc: increase of power supply (Electrical power delivered to a load (outlet, appliance, device).)
  preconditions:
    heat_on: always
    cool_on: always
    fan_on: always
    light_on: always
    outlet_on: always
- id: security_monitoring:decrease
  channel: security_monitoring
  direction: decrease
  desc: decrease of security monitoring (Intrusion monitoring / alarm protection of the home.)
  preconditions:
    alarm_disarm: always
- id: security_monitoring:increase
  channel: security_monitoring
  direction: increase
  desc: increase of security monitoring (Intrusion monitoring / alarm protection of the home.)
  preconditions:
    alarm_arm_away: always
- id: sensing_capture:increase
  channel: sensing_capture
  direction: increase
  desc: increase of sensing capture (Audio/video capture of the occupants and the home.)
  preconditions:
    camera_on: always
- id: sound:increase
  channel: sound
  direction: increase
  desc: increase of sound (Acoustic emission inside the home.)
  preconditions:
    open_window: always
    fan_on: always
    exhaust_fan_on: always
    alarm_arm_away: always
    siren_on: always
    media_play: always
    tts_announce: always
    vacuum_start: always
- id: visibility:decrease
  channel: visibility
  direction: decrease
  desc: decrease of visibility (How much of the indoor space can be seen from outside.)
  preconditions:
    close_blind: always
- id: visibility:increase
  channel: visibility
  direction: increase
  desc: increase of visibility (How much of the indoor space can be seen from outside.)
  preconditions:
    open_window: always
    open_blind: always
- id: water_flow:decrease
  channel: water_flow
  direction: decrease
  desc: decrease of water flow (Water supplied through plumbing.)
  preconditions:
    water_valve_close: always
- id: water_flow:increase
  channel: water_flow
  direction: increase
  desc: increase of water flow (Water supplied through plumbing.)
  preconditions:
    water_valve_open: always
eff:
